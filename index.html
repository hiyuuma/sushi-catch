<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>お寿司キャッチ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --wood: #3d2914;
    --wood-light: #5c3d1e;
    --red: #c62828;
    --red-bright: #e53935;
    --cream: #fff8e7;
    --belt: #4a4a4a;
    --gold: #ffb300;
    --tap-min: 44px;
  }
  html, body {
    min-height: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: linear-gradient(180deg, var(--wood) 0%, #2a1a0a 100%);
    color: var(--cream);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  h1 { font-size: 1.75rem; text-align: center; color: var(--gold); text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .screen { flex: 1; display: flex; flex-direction: column; padding: 1rem; }
  .hidden { display: none !important; }

  /* Start */
  #start-screen { justify-content: center; gap: 1.25rem; text-align: center; }
  .rules { font-size: 0.95rem; line-height: 1.5; opacity: 0.95; padding: 0 0.5rem; }
  .mode-group { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .mode-btn {
    min-height: var(--tap-min); min-width: 120px; padding: 0.75rem 1rem;
    border: 2px solid var(--wood-light); border-radius: 12px;
    background: var(--wood-light); color: var(--cream); font-size: 1rem; cursor: pointer;
  }
  .mode-btn.selected { border-color: var(--gold); background: var(--red); box-shadow: 0 0 12px rgba(255,179,0,.4); }
  .hs-line { font-size: 0.85rem; opacity: 0.85; }
  .btn-primary {
    min-height: 56px; font-size: 1.35rem; font-weight: bold;
    background: var(--red-bright); color: white; border: none; border-radius: 14px;
    cursor: pointer; box-shadow: 0 4px 0 #8b1c1c; margin-top: 0.5rem;
  }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #8b1c1c; }

  /* HUD */
  #hud {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem 0.75rem;
    font-size: 0.8rem; padding: 0.5rem 0.75rem; background: rgba(0,0,0,.35);
    border-radius: 0 0 10px 10px;
  }
  #hud .yen { grid-column: 1 / -1; font-size: 1.4rem; font-weight: bold; color: var(--gold); }
  #mute-btn {
    position: absolute; top: 0.5rem; right: 0.5rem; min-width: var(--tap-min); min-height: var(--tap-min);
    border-radius: 50%; border: 1px solid var(--wood-light); background: rgba(0,0,0,.4);
    color: var(--cream); font-size: 1.1rem; cursor: pointer; z-index: 5;
  }

  /* Ticket */
  #ticket {
    margin: 0.75rem; padding: 0.75rem; background: var(--cream); color: #333;
    border-radius: 8px; border-left: 6px solid var(--red);
    min-height: 72px; position: relative;
  }
  #ticket h2 { font-size: 0.75rem; color: #666; margin-bottom: 0.35rem; }
  .ticket-items { display: flex; flex-wrap: wrap; gap: 0.5rem; font-size: 1rem; font-weight: bold; }
  .ticket-item.done { opacity: 0.35; text-decoration: line-through; }
  #ticket-flash {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(198,40,40,.85); color: white; font-size: 1.3rem; font-weight: bold;
    border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #ticket-flash.show { opacity: 1; }

  /* Lanes */
  #lanes { flex: 1; display: flex; flex-direction: column; gap: 0.6rem; padding: 0 0.5rem 1rem; min-height: 280px; }
  .lane {
    flex: 1; min-height: 88px; position: relative; overflow: hidden;
    background: repeating-linear-gradient(90deg, var(--belt) 0, var(--belt) 8px, #3a3a3a 8px, #3a3a3a 16px);
    border-radius: 6px; border: 3px solid var(--wood-light);
    box-shadow: inset 0 4px 12px rgba(0,0,0,.4);
  }
  .lane::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.04) 50%, transparent 100%);
    animation: belt-shine 2s linear infinite; pointer-events: none;
  }
  @keyframes belt-shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .plate {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 64px; min-height: var(--tap-min); display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.15s; z-index: 2; user-select: none;
  }
  .plate-inner {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, #e8e0d0);
    border: 4px solid var(--red); box-shadow: 0 3px 6px rgba(0,0,0,.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.35rem; line-height: 1;
  }
  .plate.distractor .plate-inner { border-color: #78909c; }
  .plate-name { font-size: 0.55rem; color: var(--cream); text-shadow: 0 1px 2px #000; max-width: 70px; text-align: center; margin-top: 2px; line-height: 1.1; }
  .plate.popping .plate-inner { animation: pop 0.35s ease-out forwards; }
  .plate.mistake .plate-inner { animation: break-plate 0.5s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.9; }
    100% { transform: scale(0); opacity: 0; }
  }
  @keyframes break-plate {
    0% { transform: scale(1) rotate(0); }
    40% { transform: scale(1.1) rotate(-8deg); border-color: #333; }
    100% { transform: translateX(-30px) scale(0.3) rotate(-25deg); opacity: 0; }
  }

  .float-text {
    position: absolute; pointer-events: none; font-weight: bold; font-size: 1rem;
    animation: float-up 0.9s ease-out forwards; z-index: 10; white-space: nowrap;
  }
  .float-text.good { color: #81c784; }
  .float-text.bad { color: var(--red-bright); }
  @keyframes float-up {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-48px); }
  }
  #reaction {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 4rem; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.15s;
  }
  #reaction.show { opacity: 1; animation: react 0.6s ease-out; }
  @keyframes react {
    0% { transform: translate(-50%, -50%) scale(0.5); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* Result */
  #result-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .result-card {
    background: var(--cream); color: #222; max-width: 400px; width: 100%;
    border-radius: 16px; padding: 1.25rem; border: 4px solid var(--red);
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .result-card h2 { color: var(--red); text-align: center; margin-bottom: 0.5rem; }
  .rank-title { text-align: center; font-size: 1.25rem; color: var(--wood); margin-bottom: 1rem; font-weight: bold; }
  .result-row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid #ddd; font-size: 0.95rem; }
  .result-row.big { font-size: 1.5rem; font-weight: bold; color: var(--red); border: none; }
  .result-actions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
  .result-actions button {
    min-height: var(--tap-min); border-radius: 10px; border: none; font-size: 1rem; cursor: pointer;
  }
  .btn-x { background: #1d9bf0; color: white; }
  .btn-copy { background: var(--wood-light); color: var(--cream); }
  .btn-retry { background: var(--red-bright); color: white; font-weight: bold; }
  #speed-hint { text-align: center; font-size: 0.7rem; opacity: 0.7; padding-bottom: 0.25rem; }
</style>
</head>
<body>
<div id="app">
  <div id="start-screen" class="screen">
    <h1>お寿司キャッチ</h1>
    <p class="rules">注文票の寿司だけをタップ！間違いは値段分マイナス。60秒で何円稼げる？</p>
    <div class="mode-group">
      <button type="button" class="mode-btn selected" data-mode="normal">ゆったり</button>
      <button type="button" class="mode-btn" data-mode="rush">ランチラッシュ</button>
    </div>
    <p class="hs-line">ゆったり 最高記録: <span id="hs-normal">¥0</span></p>
    <p class="hs-line">ランチラッシュ 最高記録: <span id="hs-rush">¥0</span></p>
    <button type="button" class="btn-primary" id="start-btn">スタート</button>
  </div>

  <div id="game-screen" class="screen hidden">
    <button type="button" id="mute-btn" aria-label="ミュート">🔊</button>
    <div id="hud">
      <span>残り時間: <strong id="time-left">60</strong>秒</span>
      <span>コンボ: <strong id="combo">0</strong> <small id="mult">(×1.0)</small></span>
      <span class="yen">合計 <span id="total-yen">¥0</span></span>
      <span>ミス数: <strong id="miss-count">0</strong></span>
      <span>提供数: <strong id="served">0</strong>枚</span>
    </div>
    <p id="speed-hint">スピードが徐々に上がります</p>
    <div id="ticket">
      <h2>ご注文</h2>
      <div class="ticket-items" id="ticket-items"></div>
      <div id="ticket-flash">注文達成!</div>
    </div>
    <div id="lanes">
      <div class="lane" data-lane="0"></div>
      <div class="lane" data-lane="1"></div>
      <div class="lane" data-lane="2"></div>
    </div>
  </div>

  <div id="reaction"></div>

  <div id="result-overlay" class="hidden">
    <div class="result-card">
      <h2>結果</h2>
      <p class="rank-title" id="rank-title">見習い</p>
      <div class="result-row big"><span>獲得合計</span><span id="res-yen">¥0</span></div>
      <div class="result-row"><span>提供した皿</span><span id="res-served">0</span></div>
      <div class="result-row"><span>ミス数</span><span id="res-miss">0</span></div>
      <div class="result-row"><span>最大コンボ</span><span id="res-combo">0</span></div>
      <div class="result-row"><span>モード</span><span id="res-mode">ゆったり</span></div>
      <div class="result-actions">
        <button type="button" class="btn-x" id="share-x">結果をXでポスト</button>
        <button type="button" class="btn-copy" id="copy-result">結果をコピー</button>
        <button type="button" class="btn-retry" id="retry-btn">もう一度</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const ITEMS = {
    maguro: { name: "まぐろ", emoji: "🍣", price: 300, rare: false },
    salmon: { name: "サーモン", emoji: "🍣", price: 280, rare: false },
    ebi: { name: "えび", emoji: "🍤", price: 260, rare: false },
    tamago: { name: "たまご", emoji: "🥚", price: 200, rare: false },
    ika: { name: "いか", emoji: "🦑", price: 240, rare: false },
    uni: { name: "うに", emoji: "🟠", price: 600, rare: true },
    otoro: { name: "大トロ", emoji: "🐟", price: 800, rare: true },
    ikura: { name: "いくら", emoji: "🟡", price: 450, rare: true },
  };
  const DISTRACTORS = {
    corn: { name: "フライドコーン", emoji: "🌽", price: 150 },
    wasabi: { name: "わさび山盛り", emoji: "🟢", price: 100 },
    pudding: { name: "プリン", emoji: "🍮", price: 120 },
    karaage: { name: "からあげ", emoji: "🍗", price: 180 },
  };
  const ITEM_KEYS = Object.keys(ITEMS);
  const DIST_KEYS = Object.keys(DISTRACTORS);
  const TICKET_BONUS = 300;
  const GAME_SEC = 60;
  const LS_NORMAL = "sushiCatch_hs_normal";
  const LS_RUSH = "sushiCatch_hs_rush";

  let mode = "normal";
  let muted = false;
  let audioCtx = null;

  const el = (id) => document.getElementById(id);
  const startScreen = el("start-screen");
  const gameScreen = el("game-screen");
  const resultOverlay = el("result-overlay");

  let state = null;

  function fmtYen(n) {
    return "¥" + Math.max(0, Math.floor(n)).toLocaleString("ja-JP");
  }

  function loadHS() {
    el("hs-normal").textContent = fmtYen(parseInt(localStorage.getItem(LS_NORMAL) || "0", 10));
    el("hs-rush").textContent = fmtYen(parseInt(localStorage.getItem(LS_RUSH) || "0", 10));
  }

  function saveHS(yen) {
    const key = mode === "rush" ? LS_RUSH : LS_NORMAL;
    const prev = parseInt(localStorage.getItem(key) || "0", 10);
    if (yen > prev) localStorage.setItem(key, String(yen));
    loadHS();
  }

  function getRank(yen, served, miss) {
    if (yen >= 15000) return "寿司職人ゴッド";
    if (yen >= 10000) return "板前の鑽";
    if (yen >= 7000) return "回転寿司の星";
    if (yen >= 4000) return "上手な店員";
    if (yen >= 2000) return "見習いクルー";
    if (miss > served) return "お客様逃げちゃった…";
    return "見習い";
  }

  function priceMult() {
    return mode === "rush" ? 1.5 : 1;
  }

  function speedMult() {
    return mode === "rush" ? 1.4 : 1;
  }

  function comboBonus(combo) {
    const steps = Math.min(5, Math.floor(combo / 10));
    return 1 + steps * 0.1;
  }

  function ensureAudio() {
    if (muted || audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      audioCtx = null;
    }
  }

  function beep(freq, dur, type) {
    if (muted || !audioCtx) return;
    try {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = 0.08;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* ignore */ }
  }

  function playCorrect() { beep(660, 0.12, "sine"); }
  function playWrong() { beep(180, 0.2, "sawtooth"); }
  function playTicket() { beep(880, 0.08, "sine"); setTimeout(() => beep(1100, 0.1, "sine"), 90); }

  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      mode = btn.dataset.mode;
      document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
    });
  });

  el("mute-btn").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    muted = !muted;
    el("mute-btn").textContent = muted ? "🔇" : "🔊";
  });

  el("start-btn").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    ensureAudio();
    startGame();
  });

  function newTicket(elapsed) {
    const hardness = Math.min(1, elapsed / GAME_SEC);
    const count = hardness > 0.5 ? (Math.random() < 0.6 ? 3 : 2) : (Math.random() < 0.5 ? 2 : 3);
    const pool = ITEM_KEYS.filter((k) => {
      if (hardness < 0.35) return !ITEMS[k].rare;
      if (hardness < 0.7) return Math.random() < 0.85 || !ITEMS[k].rare;
      return true;
    });
    const chosen = [];
    const order = {};
    while (chosen.length < count && pool.length) {
      const k = pool[Math.floor(Math.random() * pool.length)];
      if (!chosen.includes(k)) {
        chosen.push(k);
        order[k] = 1 + (hardness > 0.4 && Math.random() < 0.4 ? 1 : 0);
      }
    }
    return { order, lanes: chosen };
  }

  function renderTicket() {
    const box = el("ticket-items");
    box.innerHTML = "";
    const t = state.ticket;
    for (const k of Object.keys(t.order)) {
      const span = document.createElement("span");
      span.className = "ticket-item" + (t.order[k] <= 0 ? " done" : "");
      span.textContent = ITEMS[k].emoji + " " + ITEMS[k].name + " ×" + t.order[k];
      box.appendChild(span);
    }
  }

  function startGame() {
    startScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    resultOverlay.classList.add("hidden");

    const ticket = newTicket(0);
    state = {
      startTime: performance.now(),
      lastSpawn: [0, 0, 0],
      plates: [],
      yen: 0,
      combo: 0,
      maxCombo: 0,
      miss: 0,
      served: 0,
      ticket,
      spawnBase: 2200,
      speedBase: 72,
      ended: false,
      raf: 0,
      lastFrame: 0,
    };
    document.querySelectorAll(".lane").forEach((lane) => {
      lane.querySelectorAll(".plate").forEach((p) => p.remove());
    });
    renderTicket();
    updateHUD();
    state.raf = requestAnimationFrame(loop);
  }

  function elapsedSec() {
    return (performance.now() - state.startTime) / 1000;
  }

  function ramp() {
    const t = Math.min(1, elapsedSec() / GAME_SEC);
    return 1 + t * 0.35;
  }

  function updateHUD() {
    const left = Math.max(0, Math.ceil(GAME_SEC - elapsedSec()));
    el("time-left").textContent = String(left);
    el("total-yen").textContent = fmtYen(state.yen);
    el("combo").textContent = String(state.combo);
    el("mult").textContent = "(×" + comboBonus(state.combo).toFixed(1) + ")";
    el("miss-count").textContent = String(state.miss);
    el("served").textContent = String(state.served);
    const rampPct = Math.round((ramp() - 1) * 100);
    el("speed-hint").textContent = rampPct > 0 ? "ベルト加速 +" + rampPct + "%" : "スピードが徐々に上がります";
  }

  function spawnPlate(laneIdx) {
    const elapsed = elapsedSec();
    const hardness = Math.min(1, elapsed / GAME_SEC);
    const needOnTicket = [];
    for (const k of Object.keys(state.ticket.order)) {
      if (state.ticket.order[k] > 0) needOnTicket.push(k);
    }
    let isDist = false;
    let key;
    if (needOnTicket.length && Math.random() < 0.72 - hardness * 0.1) {
      key = needOnTicket[Math.floor(Math.random() * needOnTicket.length)];
    } else if (Math.random() < 0.22 + hardness * 0.08) {
      isDist = true;
      key = DIST_KEYS[Math.floor(Math.random() * DIST_KEYS.length)];
    } else {
      key = ITEM_KEYS[Math.floor(Math.random() * ITEM_KEYS.length)];
    }

    const laneEl = document.querySelector('.lane[data-lane="' + laneIdx + '"]');
    const plate = document.createElement("div");
    plate.className = "plate" + (isDist ? " distractor" : "");
    plate.dataset.lane = String(laneIdx);
    plate.dataset.key = key;
    plate.dataset.dist = isDist ? "1" : "0";

    const data = isDist ? DISTRACTORS[key] : ITEMS[key];
    plate.innerHTML =
      '<div class="plate-inner"><span>' + data.emoji + "</span></div>" +
      '<span class="plate-name">' + data.name + "</span>";

    const w = laneEl.clientWidth;
    plate.style.left = w + 8 + "px";
    plate.addEventListener("pointerdown", onPlatePointer, { passive: false });

    laneEl.appendChild(plate);
    const spd = state.speedBase * ramp() * speedMult();
    state.plates.push({
      el: plate,
      lane: laneIdx,
      x: w + 8,
      speed: spd,
      key,
      isDist,
      dead: false,
    });
  }

  function trySpawn(now) {
    const interval = (state.spawnBase / ramp()) / speedMult();
    for (let i = 0; i < 3; i++) {
      if (now - state.lastSpawn[i] > interval * (0.85 + Math.random() * 0.3)) {
        const onLane = state.plates.filter((p) => p.lane === i && !p.dead).length;
        if (onLane < 2) {
          spawnPlate(i);
          state.lastSpawn[i] = now;
        }
      }
    }
  }

  function showFloat(plateEl, text, good) {
    const ft = document.createElement("div");
    ft.className = "float-text " + (good ? "good" : "bad");
    ft.textContent = text;
    const rect = plateEl.getBoundingClientRect();
    const lane = plateEl.closest(".lane").getBoundingClientRect();
    ft.style.left = rect.left - lane.left + "px";
    ft.style.top = rect.top - lane.top + "px";
    plateEl.closest(".lane").appendChild(ft);
    setTimeout(() => ft.remove(), 900);
  }

  function showReaction() {
    const r = el("reaction");
    r.textContent = Math.random() < 0.5 ? "😱" : "😖";
    r.classList.remove("show");
    void r.offsetWidth;
    r.classList.add("show");
    setTimeout(() => r.classList.remove("show"), 600);
  }

  function onPlatePointer(e) {
    e.preventDefault();
    e.stopPropagation();
    if (state.ended) return;
    const plateEl = e.currentTarget;
    const id = state.plates.find((p) => p.el === plateEl && !p.dead);
    if (!id) return;

    if (id.dead) return;
    id.dead = true;

    const need = state.ticket.order[id.key];
    const correct = !id.isDist && need !== undefined && need > 0;

    if (correct) {
      const base = ITEMS[id.key].price * priceMult();
      const earn = Math.round(base * comboBonus(state.combo));
      state.yen += earn;
      state.combo += 1;
      state.maxCombo = Math.max(state.maxCombo, state.combo);
      state.served += 1;
      state.ticket.order[id.key] -= 1;
      plateEl.classList.add("popping");
      showFloat(plateEl, "+" + fmtYen(earn), true);
      playCorrect();
      renderTicket();
      if (Object.values(state.ticket.order).every((n) => n <= 0)) {
        state.yen += TICKET_BONUS;
        const flash = el("ticket-flash");
        flash.classList.add("show");
        playTicket();
        setTimeout(() => flash.classList.remove("show"), 700);
        state.ticket = newTicket(elapsedSec());
        renderTicket();
        showFloat(plateEl, "+¥300", true);
      }
    } else {
      const lossItem = id.isDist ? DISTRACTORS[id.key] : ITEMS[id.key];
      const loss = Math.round((lossItem ? lossItem.price : 200) * priceMult());
      state.yen = Math.max(0, state.yen - loss);
      state.combo = 0;
      state.miss += 1;
      plateEl.classList.add("mistake");
      showFloat(plateEl, "-" + fmtYen(loss), false);
      playWrong();
      showReaction();
    }
    updateHUD();
    setTimeout(() => {
      plateEl.remove();
    }, 500);
  }

  function endGame() {
    if (state.ended) return;
    state.ended = true;
    cancelAnimationFrame(state.raf);
    saveHS(state.yen);

    const rank = getRank(state.yen, state.served, state.miss);
    el("rank-title").textContent = rank;
    el("res-yen").textContent = fmtYen(state.yen);
    el("res-served").textContent = String(state.served);
    el("res-miss").textContent = String(state.miss);
    el("res-combo").textContent = String(state.maxCombo);
    el("res-mode").textContent = mode === "rush" ? "ランチラッシュ" : "ゆったり";

    resultOverlay.classList.remove("hidden");
    gameScreen.classList.add("hidden");
  }

  function resultText() {
    const m = mode === "rush" ? "ランチラッシュ" : "ゆったり";
    return (
      "お寿司キャッチの結果🍣\n" +
      fmtYen(state.yen) + " 獲得！\n" +
      "提供 " + state.served + "枚 / ミス " + state.miss + " / 最大コンボ " + state.maxCombo + "\n" +
      "称号: " + el("rank-title").textContent + "（" + m + "）\n" +
      "#お寿司キャッチ"
    );
  }

  el("share-x").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(resultText());
    window.open(url, "_blank", "noopener,noreferrer");
  });

  el("copy-result").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const t = resultText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
    } else fallbackCopy(t);
  });

  function fallbackCopy(t) {
    const ta = document.createElement("textarea");
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (err) { /* */ }
    ta.remove();
  }

  el("retry-btn").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    resultOverlay.classList.add("hidden");
    startScreen.classList.remove("hidden");
  });

  function loop(now) {
    if (state.ended) return;
    const elapsed = elapsedSec();
    if (elapsed >= GAME_SEC) {
      updateHUD();
      endGame();
      return;
    }

    if (!state.lastSpawn[0]) {
      state.lastSpawn = [now, now - 400, now - 800];
    }
    trySpawn(now);

    const dt = state.lastFrame ? Math.min(0.05, (now - state.lastFrame) / 1000) : 1 / 60;
    state.lastFrame = now;

    state.plates = state.plates.filter((p) => {
      if (p.dead) return false;
      p.speed = state.speedBase * ramp() * speedMult();
      p.x -= p.speed * dt;
      p.el.style.left = p.x + "px";
      if (p.x < -80) {
        if (!p.isDist && state.ticket.order[p.key] > 0) {
          state.miss += 1;
          state.combo = 0;
          p.el.classList.add("mistake");
          showReaction();
        }
        p.el.remove();
        return false;
      }
      return true;
    });

    updateHUD();
    state.raf = requestAnimationFrame(loop);
  }

  loadHS();
})();
</script>
</body>
</html>
